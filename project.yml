name: CQUPTRollcall
options:
  bundleIdPrefix: com.cqupt.rollcall
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5"
    DEVELOPMENT_TEAM: ""
targets:
  CQUPTRollcall:
    type: application
    platform: iOS
    sources:
      - path: CQUPTRollcall
        excludes:
          - Info.plist
    info:
      path: CQUPTRollcall/Info.plist
      properties:
        NSCameraUsageDescription: 需要使用相机扫描签到二维码
        UILaunchScreen: {}
        CFBundleDisplayName: CQUPT签到
        NSAppTransportSecurity:
          NSExceptionDomains:
            lms.tc.cqupt.edu.cn:
              NSExceptionAllowsInsecureHTTPLoads: true
            identity.tc.cqupt.edu.cn:
              NSExceptionAllowsInsecureHTTPLoads: true
