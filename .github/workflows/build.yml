name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project CQUPTRollcall.xcodeproj \
            -scheme CQUPTRollcall \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "*.app" -path "*/Release-iphoneos/*" | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CQUPTRollcall.ipa Payload
          ls -lh CQUPTRollcall.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CQUPTRollcall-unsigned
          path: CQUPTRollcall.ipa

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CQUPTRollcall.ipa
