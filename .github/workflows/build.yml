name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "tag=build-${COUNT}" >> $GITHUB_OUTPUT
          echo "version=1.0.${COUNT}" >> $GITHUB_OUTPUT
          echo "short=${SHORT}" >> $GITHUB_OUTPUT

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project CQUPTRollcall.xcodeproj \
            -scheme CQUPTRollcall \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "*.app" -path "*/Release-iphoneos/*" | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CQUPTRollcall.ipa Payload
          ls -lh CQUPTRollcall.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CQUPTRollcall-unsigned
          path: CQUPTRollcall.ipa

      - name: Generate source.json
        if: github.event_name == 'push'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          IPA_SIZE=$(stat -f%z CQUPTRollcall.ipa)
          REPO="${{ github.repository }}"

          python3 -c "
          import json
          source = {
            'name': 'CQUPT Rollcall',
            'subtitle': '重邮自动签到',
            'description': '重庆邮电大学自动签到系统 iOS 客户端',
            'iconURL': 'https://github.com/${REPO}/releases/download/${TAG}/icon.png',
            'apps': [{
              'name': 'CQUPT签到',
              'bundleIdentifier': 'com.cqupt.rollcall.CQUPTRollcall',
              'developerName': 'Auto-CQUPT-Plan',
              'subtitle': '重邮自动签到',
              'localizedDescription': '重庆邮电大学自动签到系统。支持扫码签到、数字签到、自动定位签到，通过 Center 服务器实时共享签到码。',
              'iconURL': 'https://github.com/${REPO}/releases/download/${TAG}/icon.png',
              'tintColor': '007AFF',
              'versions': [{
                'version': '${VERSION}',
                'date': '${DATE}',
                'localizedDescription': '${VERSION} (${TAG})',
                'downloadURL': 'https://github.com/${REPO}/releases/download/${TAG}/CQUPTRollcall.ipa',
                'size': ${IPA_SIZE}
              }],
              'appPermissions': {
                'entitlements': [],
                'privacy': {
                  'NSCameraUsageDescription': '需要使用相机扫描签到二维码'
                }
              }
            }],
            'news': []
          }
          print(json.dumps(source, indent=2, ensure_ascii=False))
          " > source.json

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }} (${{ steps.version.outputs.short }})
          files: |
            CQUPTRollcall.ipa
            source.json
            icon.png
          make_latest: true
